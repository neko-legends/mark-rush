[package]
name = "markrush"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast cross-platform local Markdown viewer/editor"
repository = "https://github.com/flashosophy/MarkRush"

[dependencies]
directories = "6.0.0"
eframe = "0.34.2"
egui = "0.34.2"
open = "5.3.4"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs"] }

[build-dependencies]
embed-resource = "3.0.9"
