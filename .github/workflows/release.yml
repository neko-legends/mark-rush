# Builds Windows and Linux release assets so Neko Legends Control Center can
# install MarkRush on either OS.
#
# - Push to the `release-test` branch: build both platforms and keep the files
#   as workflow artifacts only (nothing is published) for testing.
# - Push a tag like v26.11.7: build both platforms and upload the portable
#   markrush.exe, the NSIS MarkRush-Setup.exe and markrush-linux-x86_64.zip to
#   that tag's release (created if missing).
# - Run manually with an existing tag: build only the Linux zip and add it to
#   that release, leaving its Windows assets alone.
#
# The version label baked into the binaries comes from the default build stamp
# in Build-Windows.ps1 / Build-Windows-Installer.ps1 / Build-Linux.sh.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [release-test]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to add a Linux zip to
        required: true

permissions:
  contents: write

jobs:
  linux:
    # Oldest supported Ubuntu keeps the binary's glibc requirement low, so it
    # runs on Omarchy/Arch and older distros alike.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked
      - run: bash ./Build-Linux.sh
      - name: Check the zip keeps the executable bit
        run: unzip -Z release/linux/markrush-linux-x86_64.zip | grep -E '^-rwxr-xr-x .* markrush$'
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: release/linux/markrush-linux-x86_64.zip
          if-no-files-found: error

  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build portable markrush.exe
        shell: pwsh
        run: ./Build-Windows.ps1
      - name: Build MarkRush-Setup.exe (NSIS)
        shell: pwsh
        run: ./Build-Windows-Installer.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            release/portable/markrush.exe
            release/installer/MarkRush-Setup.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    if: >-
      always() && needs.linux.result == 'success' &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Upload assets to the release
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          find assets -type f -print0 | xargs -0 gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber
